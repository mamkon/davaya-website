
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Thank You | Davaya Corporation</title>
  <link rel="icon" type="image/png" href="davaya-logo.png">
  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f6f8;
      font-family: Arial, sans-serif;
      color: #192432;
    }

    .thank-you-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      box-sizing: border-box;
    }

    .thank-you-card {
      max-width: 620px;
      width: 100%;
      padding: 55px 35px;
      background: #102438;
      color: #ffffff;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.12);
    }

    .thank-you-logo {
      width: 76px;
      height: auto;
      margin-bottom: 24px;
    }

    .checkmark {
      font-size: 54px;
      color: #c9a35d;
      margin-bottom: 15px;
    }

    .thank-you-card h1 {
      font-size: clamp(28px, 5vw, 38px);
      line-height: 1.2;
      margin: 0 0 22px;
      color: #ffffff;
    }

    .thank-you-card p {
      font-size: 17px;
      line-height: 1.7;
      color: #e4e9ef;
      margin: 0 0 18px;
    }

    .home-button {
      display: inline-block;
      margin-top: 22px;
      padding: 15px 30px;
      background: #c9a35d;
      color: #102438;
      border-radius: 30px;
      font-weight: bold;
      text-decoration: none;
    }

    .home-button:hover,
    .home-button:focus {
      background: #e0bc78;
    }

    .tagline {
      margin-top: 35px;
      font-size: 12px;
      color: #c9a35d;
      line-height: 1.8;
    }

    @media (max-width: 600px) {
      .thank-you-card {
        padding: 40px 22px;
      }
    }
  </style>
</head>

<body>
  <main class="thank-you-page">
    <section class="thank-you-card">
      <img
        src="davaya-logo.png"
        alt="Davaya Corporation"
        class="thank-you-logo"
      >

      <div class="checkmark" aria-hidden="true">&#10003;</div>

      <h1>Thank You for Contacting Davaya!</h1>

      <p>Your message has been received successfully.</p>

      <p>
        We appreciate your interest in Davaya Corporation.
        Our team will review your inquiry and get back
        to you as soon as possible.
      </p>

      <a href="/" class="home-button">
        Return to Homepage
      </a>

      <div class="tagline">
        Business Intelligence &bull; Data Analytics &bull;
        Digital Transformation
      </div>
    </section>
  </main>
</body>
</html>
